name: "CodeQL SAST Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions: {}  # default deny-all; job-level overrides below

jobs:
  analyze:
    name: CodeQL Security Scan (csharp)
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET 8 / 10 SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: "csharp"
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: "Build Solution"
        run: |
          dotnet build TapStrum.sln -c Release

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"
