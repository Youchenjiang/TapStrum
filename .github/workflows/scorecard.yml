name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6" # Every Saturday at 01:30 UTC
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Default deny-all; the job below overrides with exactly the permissions it needs
permissions: {}  # deny-all by default; job-level overrides below

jobs:
  analysis:
    name: Scorecard Security Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload the results to the GitHub Security tab
      security-events: write
      # Required to sign the results for OpenSSF badge publication
      id-token: write

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run OpenSSF Scorecard Analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository can publish results to OpenSSF REST API for badge generation
          publish_results: true

      - name: "Upload SARIF Results to GitHub Security Code Scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
