version = 1

exclude_patterns = [
  "src/TapStrum.Fluent/**",
  "src/Tapster.Fluent/**",
  "src/TapStrum.Launcher/**",
  "src/Tapster.Launcher/**",
  "src/TapStrum.Core/NativeMethods.cs",
  "src/TapStrum.Core/Keyboard.cs",
  "src/TapStrum.Core/Mouse.cs",
  "src/TapStrum.Core/MacroRecorder.cs",
  "scripts/**"
]

test_patterns = [
  "tests/**"
]

[[analyzers]]
name = "csharp"
enabled = true

[[analyzers]]
name = "python"
enabled = true
